name: Build iOS IPA & Artifacts

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    name: Build Passenger & Driver iOS Apps
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
          cache: true

      - name: Check Flutter Doctor
        run: flutter doctor -v

      # --- Build Passenger iOS App ---
      - name: Install Passenger App Dependencies
        run: |
          cd apps/passenger_app
          flutter pub get

      - name: Build Passenger App iOS (Unsigned IPA / Payload)
        run: |
          cd apps/passenger_app
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r ../../../gigaride-passenger.ipa Payload
          cd ../../..

      # --- Build Driver iOS App ---
      - name: Install Driver App Dependencies
        run: |
          cd apps/driver_app
          flutter pub get

      - name: Build Driver App iOS (Unsigned IPA / Payload)
        run: |
          cd apps/driver_app
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r ../../../gigaride-driver.ipa Payload
          cd ../../..

      # --- Upload Downloadable IPA Artifacts ---
      - name: Upload Passenger IPA
        uses: actions/upload-artifact@v4
        with:
          name: gigaride-passenger-ios-ipa
          path: apps/passenger_app/gigaride-passenger.ipa
          if-no-files-found: error

      - name: Upload Driver IPA
        uses: actions/upload-artifact@v4
        with:
          name: gigaride-driver-ios-ipa
          path: apps/driver_app/gigaride-driver.ipa
          if-no-files-found: error
